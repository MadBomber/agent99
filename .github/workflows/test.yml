name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      # Not frozen: the tocer development dependency needs a different
      # version on Ruby 3.x than on 4.0, so one lockfile can't serve every Ruby.
      - name: Install dependencies
        run: bundle install --jobs 4

      - name: Run tests
        run: bundle exec rake test
